name: Refresh public profile statistics

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_public_stats.py
      - .github/workflows/public-stats.yml

permissions:
  contents: write

concurrency:
  group: public-profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Collect public repository totals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_public_stats.py
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- assets/public-stats.svg assets/public-stats.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/public-stats.svg assets/public-stats.json
          git commit -m "Refresh public repository statistics [skip ci]"
          git push origin HEAD:main
